/*
   Application Goal Miners

   Gradle build file for JaCaMo Application
*/

defaultTasks 'run'

apply plugin: 'java'

version '1.0'
group   'org.jacamo'


repositories {
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/jacamo-lang/mvn-repo/master" }
    maven { url "https://repo.gradle.org/gradle/libs-releases" }
    //flatDir { dirs 'lib' }
}

dependencies {
    implementation('org.jacamo:jacamo:1.3.0')
    implementation files('lib/search.jar')
    implementation('org.twitter4j:twitter4j-async:4.0.7')
    implementation('org.twitter4j:twitter4j-stream:4.0.7')
}

sourceSets {
    main {
        java {
            srcDir 'src/env'
            srcDir 'src/agt'
            srcDir 'src/org'
            srcDir 'src/int'
            srcDir 'src/java'
        }
        resources {
            srcDir 'src/resources'
        }
    }
}

task run (type: JavaExec, dependsOn: 'classes') {
    description 'runs the application'
    timeout = java.time.Duration.ofMinutes(3)
    group ' JaCaMo'
    doFirst { mkdir 'log' }
    mainClass = project.hasProperty('projectFile') ? 'jacamo.infra.JaCaMoLauncher' : 'contest.MatchLauncher'
    args project.hasProperty('projectFile') ? project.property('projectFile') : providers.gradleProperty('config').getOrElse('config/default.properties')
    systemProperty 'java.awt.headless', 'true'
    ['seed','red','blue','steps','exploration','output','agents'].each { key ->
        if (project.hasProperty(key)) systemProperty "contest.${key}", project.property(key)
    }
    classpath sourceSets.main.runtimeClasspath
}

task buildJCMDeps (type: JavaExec, dependsOn: 'classes') {
    mainClass = 'jacamo.infra.RunJaCaMoProject'
    args = ['gold_miners.jcm', '--deps']
    classpath sourceSets.main.runtimeClasspath
}

clean {
    delete 'bin'
    delete 'build'
}


dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test { useJUnitPlatform() }
tasks.register('experiment', JavaExec) {
    dependsOn classes
    mainClass = 'contest.Experiment'
    classpath = sourceSets.main.runtimeClasspath
    args providers.gradleProperty('config').getOrElse('config/default.properties'), providers.gradleProperty('seeds').getOrElse('5'),
         providers.gradleProperty('output').getOrElse('build/results/policies.csv')
}

// Compile once; experiment subprocesses reuse this exact runtime classpath.
tasks.register('preparar') {
    dependsOn classes
    outputs.file(layout.buildDirectory.file('runtime-classpath.txt'))
    doLast {
        file('build/runtime-classpath.txt').text = sourceSets.main.runtimeClasspath.asPath
    }
}
